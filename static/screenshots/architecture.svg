<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#e3b341"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <filter id="glow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="900" height="520" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700">RAG Architecture — AI Study Assistant</text>

  <!-- === UPLOAD BOX === -->
  <rect x="40" y="70" width="180" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#glow)"/>
  <text x="130" y="98" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="600">📄 Upload</text>
  <text x="130" y="118" text-anchor="middle" fill="#8b949e" font-size="11">PDF / DOCX / TXT</text>

  <!-- Arrow 1 -->
  <line x1="220" y1="105" x2="275" y2="105" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- === EXTRACT & CHUNK === -->
  <rect x="280" y="70" width="180" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#glow)"/>
  <text x="370" y="98" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="600">✂️ Chunking</text>
  <text x="370" y="118" text-anchor="middle" fill="#8b949e" font-size="11">Semantic paragraph split</text>
  <text x="370" y="133" text-anchor="middle" fill="#8b949e" font-size="10">500-800 char windows</text>

  <!-- Arrow 2 -->
  <line x1="460" y1="105" x2="515" y2="105" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- === TF-IDF INDEX === -->
  <rect x="520" y="60" width="170" height="90" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1.5" filter="url(#glow)"/>
  <text x="605" y="88" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="600">🔍 Vector Index</text>
  <text x="605" y="108" text-anchor="middle" fill="#8b949e" font-size="11">TF-IDF + bigrams</text>
  <text x="605" y="123" text-anchor="middle" fill="#8b949e" font-size="11">sublinear tf, l2 norm</text>
  <text x="605" y="138" text-anchor="middle" fill="#8b949e" font-size="11">8,000 max features</text>

  <!-- Arrow 3 down -->
  <line x1="605" y1="150" x2="605" y2="205" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- === RETRIEVAL === -->
  <rect x="420" y="210" width="370" height="80" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5" filter="url(#glow)"/>
  <text x="605" y="240" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="600">🎯 Hybrid Retrieval</text>
  <text x="605" y="260" text-anchor="middle" fill="#8b949e" font-size="11">Cosine similarity (70%) + Keyword term overlap boost (30%)</text>
  <text x="605" y="278" text-anchor="middle" fill="#8b949e" font-size="11">Top-8 candidates → Top-5 final</text>

  <!-- Arrow 4 down -->
  <line x1="605" y1="290" x2="605" y2="335" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- === ANSWER GENERATION === -->
  <rect x="360" y="340" width="490" height="90" rx="8" fill="#161b22" stroke="#238636" stroke-width="1.5" filter="url(#glow)"/>
  <text x="605" y="368" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="600">🤖 Answer Generation</text>
  <rect x="375" y="380" width="220" height="36" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="485" y="403" text-anchor="middle" fill="#8b949e" font-size="11">Local Mode: Best excerpt</text>
  <rect x="610" y="380" width="225" height="36" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="722" y="397" text-anchor="middle" fill="#8b949e" font-size="11">OpenAI: GPT-4o-mini</text>
  <text x="722" y="412" text-anchor="middle" fill="#8b949e" font-size="10">with inline citations [1][2]</text>

  <!-- Arrow 5 -->
  <line x1="605" y1="430" x2="605" y2="460" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- === USER === -->
  <rect x="480" y="465" width="250" height="40" rx="20" fill="url(#green)" filter="url(#glow)"/>
  <text x="605" y="490" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">👤 Answer to User</text>

  <!-- === SIDEBAR: Query === -->
  <rect x="40" y="210" width="220" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#glow)"/>
  <text x="150" y="238" text-anchor="middle" fill="#f0f6fc" font-size="14" font-weight="600">💬 User Query</text>
  <text x="150" y="258" text-anchor="middle" fill="#8b949e" font-size="11">"What is deep learning?"</text>

  <!-- Arrow query -> retrieval -->
  <line x1="260" y1="240" x2="415" y2="250" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="30" y="340" width="240" height="100" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="150" y="362" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="600">Legend</text>
  <circle cx="60" cy="382" r="5" fill="#1f6feb"/>
  <text x="75" y="386" fill="#8b949e" font-size="11">Vector Indexing</text>
  <circle cx="60" cy="402" r="5" fill="#d29922"/>
  <text x="75" y="406" fill="#8b949e" font-size="11">Hybrid Retrieval</text>
  <circle cx="60" cy="422" r="5" fill="#238636"/>
  <text x="75" y="426" fill="#8b949e" font-size="11">Answer Generation</text>
</svg>
